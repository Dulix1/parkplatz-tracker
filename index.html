<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkplatzverwaltung</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #2563EB;
      --primary-dark: #1D4ED8;
      --free:         #16A34A;
      --free-bg:      #DCFCE7;
      --free-border:  #86EFAC;
      --taken:        #DC2626;
      --taken-bg:     #FEE2E2;
      --taken-border: #FCA5A5;
      --until:        #D97706;
      --until-bg:     #FEF3C7;
      --until-border: #FCD34D;
      --text:         #1E293B;
      --text-muted:   #64748B;
      --border:       #E2E8F0;
      --bg:           #F1F5F9;
      --card:         #FFFFFF;
      --radius:       16px;
      --radius-sm:    10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }

    /* ── Test-Modus Banner ── */
    #testBanner {
      background: var(--until-bg);
      color: #92400E;
      border: 1px solid var(--until-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
    }
    .hidden { display: none !important; }

    /* ── Header ── */
    header { text-align: center; margin: 8px 0 18px; }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    header .date {
      color: var(--text-muted);
      font-size: .95rem;
      margin-top: 4px;
      text-transform: capitalize;
    }

    /* ── Statusleiste ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 8px;
      text-align: center;
    }
    .stat .num { font-size: 1.9rem; font-weight: 800; line-height: 1; }
    .stat .lbl { font-size: .75rem; color: var(--text-muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .stat.free  .num { color: var(--free); }
    .stat.taken .num { color: var(--taken); }

    /* ── Kacheln ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .tile {
      border-radius: var(--radius);
      border: 2px solid;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 170px;
    }
    .tile.free  { background: var(--free-bg);  border-color: var(--free-border); }
    .tile.taken { background: var(--taken-bg); border-color: var(--taken-border); }
    .tile.until { background: var(--until-bg); border-color: var(--until-border); }

    .tile-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .tile-name { font-size: 1.05rem; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .badge {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: .65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: #fff;
    }
    .tile.free  .badge { background: var(--free); }
    .tile.taken .badge { background: var(--taken); }
    .tile.until .badge { background: var(--until); }

    .tile-body { flex: 1; font-size: .95rem; line-height: 1.4; min-width: 0; }
    .tile-body .who { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; word-break: break-word; }
    .tile-body .until-time { font-weight: 700; }
    .tile-body .note { color: var(--text-muted); font-size: .85rem; margin-top: 4px; word-break: break-word; }
    .tile-body .empty { color: var(--text-muted); }

    /* ── Buttons ── */
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: filter .15s, transform .05s;
    }
    .btn:active { transform: scale(.98); }
    .btn:hover { filter: brightness(.95); }
    .btn-occupy  { background: var(--free);  color: #fff; }
    .btn-release { background: #fff; color: var(--taken); border: 2px solid var(--taken-border); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost   { background: #fff; color: var(--text-muted); border: 1px solid var(--border); }
    .tile .btn { margin-top: 10px; }

    /* ── Reset ── */
    .footer { margin-top: 24px; text-align: center; }
    .btn-reset {
      background: #fff;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reset:hover { background: #F8FAFC; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.55);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 50;
    }
    .modal {
      background: #fff;
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }
    .modal h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 5px; }
    .field input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
    }
    .field input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; }

    @media (max-width: 420px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      header h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="testBanner" class="hidden">⚠️ Testmodus – Daten werden nur auf diesem Gerät gespeichert. Firebase einrichten, damit alle denselben Stand sehen.</div>

    <header>
      <h1>🅿️ Parkplatzverwaltung</h1>
      <div class="date" id="dateLabel"></div>
    </header>

    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Plätze</div></div>
      <div class="stat taken"><div class="num" id="statTaken">0</div><div class="lbl">Belegt</div></div>
      <div class="stat free"><div class="num" id="statFree">0</div><div class="lbl">Frei</div></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- Buchungs-Formular -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Platz <span id="modalSpot"></span> belegen</h2>
      <div class="field">
        <label for="fName">Name *</label>
        <input id="fName" type="text" placeholder="z. B. Thomas" autocomplete="off" maxlength="40">
      </div>
      <div class="field">
        <label for="fUntil">Belegt bis (optional)</label>
        <input id="fUntil" type="time">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">Abbrechen</button>
        <button class="btn btn-primary" id="saveBtn">Speichern</button>
      </div>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════════════════════════
     HIER ANPASSEN
     ════════════════════════════════════════════════════════════ */

  // Parkplätze – einfach Namen ergänzen oder entfernen:
  const PARKPLAETZE = ["IN-KA40", "IN-KA20", "Julia", "Heidi", "P"];

  // Firebase-Zugangsdaten hier einfügen (siehe README).
  // Solange leer, läuft die App im lokalen Testmodus.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyAeo40ow7Azi4FVvGiVIubPYyYwYFKnzho",
    authDomain: "parkplatz-kolping.firebaseapp.com",
    databaseURL: "https://parkplatz-kolping-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "parkplatz-kolping",
    storageBucket: "parkplatz-kolping.firebasestorage.app",
    messagingSenderId: "1043982590121",
    appId: "1:1043982590121:web:ec51c5024dccbe6f6309b8"
  };

  /* ════════════════════════════════════════════════════════════
     Ab hier muss nichts mehr geändert werden.
     ════════════════════════════════════════════════════════════ */

  const useFirebase = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL);
  let dbRef = null;          // Firebase-Referenz (nur im Firebase-Modus)
  let currentState = null;   // aktueller Zustand
  let pendingSpot = null;    // Platz, der gerade belegt wird

  // ── Hilfsfunktionen ──
  function blankState() {
    const spots = {};
    PARKPLAETZE.forEach(p => spots[p] = null);
    return { spots };
  }

  // Stellt sicher, dass der Zustand zu den konfigurierten Plätzen passt.
  // Kein automatischer Tages-Reset: Belegungen bleiben bestehen, bis sie
  // manuell freigegeben werden. Gibt {state, changed} zurück.
  function normalize(data) {
    if (!data || typeof data !== 'object') {
      return { state: blankState(), changed: true };
    }
    const spots = {};
    const src = data.spots || {};
    PARKPLAETZE.forEach(p => { spots[p] = src[p] || null; });
    return { state: { spots }, changed: false };
  }

  // ── Speichern ──
  function persist(state) {
    currentState = state;
    if (useFirebase) {
      dbRef.set(state);          // löst onValue aus → render()
    } else {
      localStorage.setItem('parkplatz', JSON.stringify(state));
      render(state);
    }
  }

  // ── Aktionen ──
  function occupy(spot, name, until) {
    const state = currentState || blankState();
    state.spots[spot] = {
      name: name,
      until: until || null,
      since: new Date().toISOString()
    };
    persist(state);
  }

  function release(spot) {
    const state = currentState || blankState();
    state.spots[spot] = null;
    persist(state);
  }

  // Zeitpunkt, zu dem ein "belegt bis"-Platz abläuft (oder null).
  function expiryDate(info) {
    if (!info || !info.until) return null;
    const parts = String(info.until).split(':');
    const h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    if (isNaN(h) || isNaN(m)) return null;
    const ref = info.since ? new Date(info.since) : new Date();
    const exp = new Date(ref);
    exp.setHours(h, m, 0, 0);
    // Liegt die Uhrzeit vor dem Belegen, gilt sie für den nächsten Tag.
    if (exp.getTime() <= ref.getTime()) exp.setDate(exp.getDate() + 1);
    return exp;
  }

  // Gibt abgelaufene "belegt bis"-Plätze frei. Liefert true, wenn etwas geändert wurde.
  function releaseExpired(state) {
    let changed = false;
    PARKPLAETZE.forEach(p => {
      const info = state.spots[p];
      const exp = expiryDate(info);
      if (exp && Date.now() >= exp.getTime()) {
        state.spots[p] = null;
        changed = true;
      }
    });
    return changed;
  }

  // ── Darstellung ──
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render(state) {
    currentState = state;

    document.getElementById('dateLabel').textContent =
      new Date().toLocaleDateString('de-DE',
        { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    const total = PARKPLAETZE.length;
    let taken = 0;
    PARKPLAETZE.forEach(p => { if (state.spots[p]) taken++; });
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statTaken').textContent = taken;
    document.getElementById('statFree').textContent = total - taken;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    PARKPLAETZE.forEach(spot => {
      const info = state.spots[spot];
      const tile = document.createElement('div');

      if (!info) {
        tile.className = 'tile free';
        tile.innerHTML = `
          <div class="tile-head">
            <span class="tile-name">${esc(spot)}</span>
            <span class="badge">frei</span>
          </div>
          <div class="tile-body"><span class="empty">Verfügbar</span></div>
          <button class="btn btn-occupy" data-occupy="${esc(spot)}">Jetzt belegen</button>`;
      } else {
        const hasUntil = !!info.until;
        tile.className = 'tile ' + (hasUntil ? 'until' : 'taken');
        const untilHtml = hasUntil
          ? `<div>bis <span class="until-time">${esc(info.until)} Uhr</span></div>` : '';
        tile.innerHTML = `
          <div class="tile-head">
            <span class="tile-name">${esc(spot)}</span>
            <span class="badge">belegt</span>
          </div>
          <div class="tile-body">
            <div class="who">${esc(info.name)}</div>
            ${untilHtml}
          </div>
          <button class="btn btn-release" data-release="${esc(spot)}">Freigeben</button>`;
      }
      grid.appendChild(tile);
    });
  }

  // ── Modal ──
  function openModal(spot) {
    pendingSpot = spot;
    document.getElementById('modalSpot').textContent = spot;
    document.getElementById('fName').value = '';
    document.getElementById('fUntil').value = '';
    document.getElementById('modal').classList.remove('hidden');
    document.getElementById('fName').focus();
  }
  function closeModal() {
    pendingSpot = null;
    document.getElementById('modal').classList.add('hidden');
  }

  // ── Events ──
  document.getElementById('grid').addEventListener('click', e => {
    const occ = e.target.closest('[data-occupy]');
    const rel = e.target.closest('[data-release]');
    if (occ) openModal(occ.getAttribute('data-occupy'));
    if (rel) release(rel.getAttribute('data-release'));
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim();
    if (!name) { document.getElementById('fName').focus(); return; }
    const until = document.getElementById('fUntil').value;
    occupy(pendingSpot, name, until);
    closeModal();
  });

  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
  document.getElementById('fName').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('saveBtn').click();
  });

  // ── Start ──
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function init() {
    if (useFirebase) {
      try {
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
        firebase.initializeApp(FIREBASE_CONFIG);
        dbRef = firebase.database().ref('parkplatz');
        dbRef.on('value', snap => {
          const { state, changed } = normalize(snap.val());
          const expired = releaseExpired(state);   // abgelaufene Plätze freigeben
          currentState = state;
          render(state);                 // immer anzeigen, nicht erst nach dem Schreiben
          if (changed || expired) dbRef.set(state).catch(e => console.error('Speichern fehlgeschlagen:', e));
        }, err => {
          // Lese-/Schreibrechte oder Verbindung fehlgeschlagen
          console.error('Datenbank-Zugriff fehlgeschlagen:', err);
          const banner = document.getElementById('testBanner');
          banner.textContent = '⚠️ Verbindung zur Datenbank fehlgeschlagen – bitte Firebase-Regeln prüfen (' + (err.code || err.message) + ').';
          banner.classList.remove('hidden');
          render(normalize(null).state); // wenigstens leere Übersicht anzeigen
        });
        return;
      } catch (err) {
        console.error('Firebase konnte nicht geladen werden, wechsle in Testmodus.', err);
      }
    }
    // Testmodus (localStorage)
    document.getElementById('testBanner').classList.remove('hidden');
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem('parkplatz')); } catch (e) {}
    const { state, changed } = normalize(stored);
    const expired = releaseExpired(state);
    currentState = state;
    if (changed || expired) localStorage.setItem('parkplatz', JSON.stringify(state));
    render(state);
  }

  // Regelmäßig prüfen, ob ein "belegt bis"-Platz abgelaufen ist, und ihn freigeben.
  setInterval(() => {
    if (currentState && releaseExpired(currentState)) {
      persist(currentState);
    }
  }, 30000);

  init();
  </script>
</body>
</html>
